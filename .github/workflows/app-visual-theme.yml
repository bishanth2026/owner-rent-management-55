name: Apply BIZNEXCO Visual Theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add visual theme to index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="visual-theme.js?v=1"></script>'
          if marker not in text:
              if '</body>' in text:
                  text = text.replace('</body>', marker + '\n</body>', 1)
              else:
                  text += '\n' + marker + '\n'
              p.write_text(text, encoding='utf-8')
              print('Visual theme script added to index.html')
          else:
              print('Visual theme script already present')

      - name: Commit HTML update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No HTML changes required"
          else
            git commit -m "Add colorful visual theme to all app pages"
            git push
          fi
