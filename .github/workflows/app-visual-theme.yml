name: Apply BIZNEXCO Visual Theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair report HTML generation safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          start = text.find('let content=')
          end = text.find('  let blob=', start)
          if start >= 0 and end > start:
              segment = text[start:end]
              anchor = 'outerHTML+'
              pos = segment.rfind(anchor)
              if pos >= 0:
                  fixed = segment[:pos + len(anchor)] + '"</body></html>";\n'
                  if fixed != segment:
                      text = text[:start] + fixed + text[end:]
                      p.write_text(text, encoding='utf-8')
                      print('Repaired report HTML generator tail')
                  else:
                      print('Report HTML generator tail already safe')
              else:
                  print('Report HTML anchor not found')
          else:
              print('Report generator boundaries not found')

      - name: Ensure visual theme script is loaded at document end
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="visual-theme.js?v=1"></script>'
          if marker in text:
              first = text.find(marker)
              last_body = text.rfind('</body>')
              if first < last_body:
                  text = text[:first] + text[first + len(marker):]
                  last_body = text.rfind('</body>')
                  text = text[:last_body] + marker + '\n' + text[last_body:]
                  p.write_text(text, encoding='utf-8')
                  print('Moved visual theme script to the real document end')
              else:
                  print('Visual theme script is already at document end')
          else:
              last_body = text.rfind('</body>')
              if last_body >= 0:
                  text = text[:last_body] + marker + '\n' + text[last_body:]
              else:
                  text += '\n' + marker + '\n'
              p.write_text(text, encoding='utf-8')
              print('Added visual theme script at document end')

      - name: Commit HTML update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No HTML changes required"
          else
            git commit -m "Fix visual theme injection without changing app logic"
            git push
          fi
