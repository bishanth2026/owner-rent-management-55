name: Apply BIZNEXCO Visual Theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair report HTML generation safely
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          start = text.find('let content=')
          end = text.find('  let blob=', start)
          if start >= 0 and end > start:
              segment = text[start:end]
              pattern = r'(\+document\.querySelector\(\\?"#reportPrintArea \.tablewrap\\?"\)\.outerHTML\+\").*?(?=\n  let blob=)'
              fixed, count = re.subn(pattern, r'\1</body></html>";', segment, count=1, flags=re.S)
              if count:
                  text = text[:start] + fixed + text[end:]
                  p.write_text(text, encoding='utf-8')
                  print('Repaired report HTML string without changing app logic')
              else:
                  print('Report HTML tail already safe')
          else:
              print('Report generator boundaries not found; no change made')

      - name: Add visual theme to index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="visual-theme.js?v=1"></script>'
          if marker not in text:
              if '</body>' in text:
                  text = text.replace('</body>', marker + '\n</body>', 1)
              else:
                  text += '\n' + marker + '\n'
              p.write_text(text, encoding='utf-8')
              print('Visual theme script added to index.html')
          else:
              print('Visual theme script already present')

      - name: Commit HTML update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No HTML changes required"
          else
            git commit -m "Repair report HTML generation safely"
            git push
          fi
