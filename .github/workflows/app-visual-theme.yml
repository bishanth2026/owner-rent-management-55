name: Apply BIZNEXCO Visual Theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair report HTML generation safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          start = text.find('let content=')
          end = text.find('  let blob=', start)
          if start >= 0 and end > start:
              segment = text[start:end]
              anchor = 'outerHTML+'
              pos = segment.rfind(anchor)
              if pos >= 0:
                  fixed = segment[:pos + len(anchor)] + '"</body></html>";\n'
                  if fixed != segment:
                      text = text[:start] + fixed + text[end:]
                      p.write_text(text, encoding='utf-8')
                      print('Finalized safe report HTML string')
                  else:
                      print('Report HTML tail already safe')
              else:
                  print('Report HTML anchor not found; no change made')
          else:
              print('Report generator boundaries not found; no change made')

      - name: Add visual theme to index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="visual-theme.js?v=1"></script>'
          if marker not in text:
              if '</body>' in text:
                  text = text.replace('</body>', marker + '\n</body>', 1)
              else:
                  text += '\n' + marker + '\n'
              p.write_text(text, encoding='utf-8')
              print('Visual theme script added to index.html')
          else:
              print('Visual theme script already present')

      - name: Commit HTML update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No HTML changes required"
          else
            git commit -m "Finalize report HTML script fix"
            git push
          fi
