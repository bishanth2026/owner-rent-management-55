name: Repair button JavaScript 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove invalid nested script from generated report string
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          pattern = r'<script\s+src=.*?visual-theme\.js\?v=1.*?</script>\s*</body></html>'
          new_text, count = re.subn(pattern, '</body></html>', text, count=1, flags=re.S)
          if count:
              p.write_text(new_text, encoding='utf-8')
              print('FIXED nested visual-theme script inside JavaScript string')
          else:
              print('No nested visual-theme script found')
      - name: Commit if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No change"; else git commit -m "Fix invalid JavaScript blocking all buttons"; git push; fi
