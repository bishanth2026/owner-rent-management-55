name: Apply app visual update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  visual-update:
    if: "!contains(github.event.head_commit.message, '[visual-update]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add colorful visual layer
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* BIZNEXCO COLORFUL VISUAL LAYER v1 */'
          if marker in s:
              raise SystemExit(0)
          css = r'''
          <style>
          /* BIZNEXCO COLORFUL VISUAL LAYER v1 */
          :root{
            --biz-navy:#0b1733;--biz-blue:#2563eb;--biz-cyan:#06b6d4;--biz-violet:#7c3aed;
            --biz-green:#16a34a;--biz-orange:#f97316;--biz-gold:#f59e0b;--biz-pink:#ec4899;
          }
          body{background:linear-gradient(135deg,#f5f8ff 0%,#eef6ff 45%,#fff8ef 100%)}
          header{background:linear-gradient(110deg,#07152f 0%,#123a75 55%,#172554 100%);box-shadow:0 5px 24px rgba(15,23,42,.18)}
          header .brand{letter-spacing:.2px}
          nav{background:rgba(255,255,255,.96);box-shadow:0 6px 22px rgba(15,23,42,.08);border-bottom:0}
          nav button{border:1px solid #dbe4f0;background:linear-gradient(180deg,#f8fbff,#e8eef8);transition:transform .18s,box-shadow .18s,background .18s;color:#1e293b}
          nav button:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(37,99,235,.16)}
          nav button.active{background:linear-gradient(135deg,#0f172a,#2563eb);box-shadow:0 7px 18px rgba(37,99,235,.24);color:#fff}
          .page.active{animation:bizFade .22s ease-out}
          @keyframes bizFade{from{opacity:.65;transform:translateY(3px)}to{opacity:1;transform:none}}
          .card,.settings-card,.tenant-premium-panel{box-shadow:0 8px 26px rgba(30,64,175,.07);border-color:#dce6f3}
          .card:nth-child(4n+1){border-top:3px solid var(--biz-blue)}
          .card:nth-child(4n+2){border-top:3px solid var(--biz-orange)}
          .card:nth-child(4n+3){border-top:3px solid var(--biz-green)}
          .card:nth-child(4n){border-top:3px solid var(--biz-violet)}
          .primary{background:linear-gradient(135deg,#0f172a,#2563eb);box-shadow:0 6px 15px rgba(37,99,235,.18)}
          .secondary{background:#fff;border-color:#bcd0ea}
          .section{display:flex;align-items:center;gap:9px;color:#102a56}
          .section:before{content:"";display:inline-block;width:8px;height:24px;border-radius:8px;background:linear-gradient(#2563eb,#06b6d4);box-shadow:0 3px 8px rgba(37,99,235,.25)}
          .tablewrap{border-radius:12px}
          th{background:linear-gradient(90deg,#eff6ff,#f8fafc);color:#1e3a8a}
          .notice{box-shadow:0 4px 14px rgba(37,99,235,.08)}
          .owner-dashboard-hero{background:linear-gradient(135deg,#09204a,#2563eb 58%,#06b6d4)}
          .owner-dashboard-hero:after{content:"";position:absolute;right:24px;bottom:18px;width:180px;height:150px;border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.2);transform:rotate(-7deg)}
          .owner-dashboard-overlay h2,.owner-dashboard-overlay p{color:#fff}
          .owner-dashboard-overlay .eyebrow{color:#fde68a}
          .tenant-premium-hero{background:linear-gradient(135deg,#052e4f,#2563eb,#7c3aed)}
          .tenant-premium-hero:after{content:"";position:absolute;right:25px;bottom:20px;width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.22)}
          .tenant-premium-chip{box-shadow:0 5px 15px rgba(0,0,0,.12)}
          .tenant-premium-kpis .card:nth-child(1){background:linear-gradient(135deg,#fff,#eff6ff)}
          .tenant-premium-kpis .card:nth-child(2){background:linear-gradient(135deg,#fff,#fff7ed)}
          .tenant-premium-kpis .card:nth-child(3){background:linear-gradient(135deg,#fff,#f0fdf4)}
          .tenant-premium-kpis .card:nth-child(4){background:linear-gradient(135deg,#fff,#fff1f2)}
          .login-visual{background:linear-gradient(135deg,#06142f,#123a75 52%,#4c1d95)}
          .login-feature{background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.04));backdrop-filter:blur(3px)}
          .login-form-panel{background:linear-gradient(180deg,#fff,#f8fbff)}
          .login-role button.active{background:linear-gradient(135deg,#0f172a,#2563eb);border-color:#2563eb}
          .login-submit{background:linear-gradient(90deg,#0f172a,#2563eb,#7c3aed)}
          .settings-card h3{color:#123a75}
          @media(max-width:600px){
            nav{box-shadow:0 4px 14px rgba(15,23,42,.08)}
            nav button{border-radius:15px;padding:9px 13px}
            .card{box-shadow:0 5px 16px rgba(30,64,175,.06)}
            .owner-dashboard-hero:after,.tenant-premium-hero:after{width:100px;height:100px;right:12px;bottom:12px}
          }
          </style>
          '''
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit visual update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Apply colorful app pages [visual-update]"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/app-visual-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove temporary visual update workflow [visual-update]"
          git push
