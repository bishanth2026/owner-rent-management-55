name: Repair button JavaScript

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair broken generated report string
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old1 = '<script src=\\"visual-theme.js?v=1\\"></script>\\n</body></html>'
          old2 = '<script src="visual-theme.js?v=1"></script>\\n</body></html>'
          changed = False
          for old in (old1, old2):
              if old in text:
                  text = text.replace(old, '</body></html>', 1)
                  changed = True
          if changed:
              p.write_text(text, encoding='utf-8')
              print('FIXED: removed broken nested script tag from generated report JavaScript string')
          else:
              print('No matching broken report string found')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix button actions by repairing report JavaScript"
            git push
          fi
