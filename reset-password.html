<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — BIZNEXCO</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.card{background:#fff;padding:30px;border-radius:14px;max-width:380px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.1)}
h2{margin-top:0}
input{width:100%;padding:11px;margin:8px 0;border:1px solid #cbd5e1;border-radius:9px;box-sizing:border-box}
button{width:100%;padding:12px;border:0;border-radius:9px;background:#0f172a;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{font-size:13px;margin-top:10px}
.err{color:#991b1b}.ok{color:#166534}
</style>
</head>
<body>
<div class="card">
  <h2>Set a New Password</h2>
  <input id="newPw" type="password" placeholder="New password (min 6 characters)" autocomplete="new-password">
  <input id="confirmPw" type="password" placeholder="Confirm new password" autocomplete="new-password">
  <button id="submitBtn">Update Password</button>
  <div id="msg" class="msg"></div>
</div>
<script type="module">
  import { supabase } from './lib/supabaseClient.js';
import { ownerCompletePasswordReset } from './lib/ownerAuth.js';

  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      msg.textContent = 'Enter your new password below.';
      msg.className = 'msg';
    }
  });

  submitBtn.onclick = async () => {
    const pw = document.getElementById('newPw').value;
    const cpw = document.getElementById('confirmPw').value;
    if (pw.length < 6) { msg.textContent = 'Password must be at least 6 characters.'; msg.className = 'msg err'; return; }
    if (pw !== cpw) { msg.textContent = 'Passwords do not match.'; msg.className = 'msg err'; return; }
    submitBtn.disabled = true;
    try {
      await ownerCompletePasswordReset(pw);
      msg.textContent = 'Password updated. You can now close this page and log in.';
      msg.className = 'msg ok';
    } catch (err) {
      msg.textContent = err.message || 'Could not update password.';
      msg.className = 'msg err';
      submitBtn.disabled = false;
    }
  };
</script>
</body>
</html>
